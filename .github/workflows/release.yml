name: Release Plugin Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: Tipo de release (draft, prerelease, published)
        required: true
        default: published
        type: choice
        options:
          - draft
          - prerelease
          - published

permissions:
  contents: write

jobs:
  build:
    name: Build sidecars (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: .exe
            upx: true
          - os: windows
            arch: arm64
            runner: windows-latest
            ext: .exe
            upx: false        # UPX no soporta ARM64 PE aun
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ''
            upx: true
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            ext: ''
            upx: true
          - os: darwin
            arch: amd64
            runner: macos-latest
            ext: ''
            upx: false        # UPX en macOS requiere codesign; skip
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ''
            upx: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Parse plugin name from joss.yaml
        id: meta
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import os, sys
          with open('joss.yaml', encoding='utf-8-sig') as f:
              lines = f.read().splitlines()
          vals = {}
          for l in lines:
              if ':' in l and not l.startswith(' '):
                  k, _, v = l.partition(':')
                  vals[k.strip()] = v.strip().strip('"').strip("'")
          name = vals.get('name', '')
          ver  = vals.get('version', '')
          if not name or not ver:
              print(f'ERROR: name={name!r} version={ver!r}', file=sys.stderr)
              sys.exit(1)
          ref_type = os.environ.get('GITHUB_REF_TYPE', '')
          ref_name = os.environ.get('GITHUB_REF_NAME', '')
          tag = ref_name if ref_type == 'tag' else f'v{ver}'
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as f:
              f.write(f'name={name}\n')
              f.write(f'version={ver}\n')
              f.write(f'tag={tag}\n')
          print(f'Plugin: {name} v{ver} tag={tag}')
          PYEOF

      - name: Compile sidecar
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          NAME="${{ steps.meta.outputs.name }}"
          OUT="sidecar-build/${NAME}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          mkdir -p sidecar-build
          go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/sidecar
          echo "Built: $OUT ($(du -sh "$OUT" | cut -f1))"

      - name: Compress with UPX
        if: matrix.upx == true
        shell: bash
        run: |
          NAME="${{ steps.meta.outputs.name }}"
          OUT="sidecar-build/${NAME}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          # Install UPX
          if command -v apt-get &>/dev/null; then
            sudo apt-get install -y upx-ucl 2>/dev/null || sudo apt-get install -y upx
          fi
          upx --best --lzma "$OUT" && echo "Compressed: $(du -sh "$OUT" | cut -f1)" || echo "UPX failed, using uncompressed binary"

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.os }}-${{ matrix.arch }}
          path: sidecar-build/
          retention-days: 1

  release:
    name: Pack .jp & Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Joss CLI
        shell: bash
        run: |
          # Fetch latest joss CLI release for Linux
          RELEASES=$(curl -sf "https://api.github.com/repos/joss-language/Joss-Programming-Language/releases" \
            -H "User-Agent: Joss-Plugin-Builder" || \
            curl -sf "https://api.github.com/repos/josprox/Joss-language/releases" \
            -H "User-Agent: Joss-Plugin-Builder")

          ASSET_URL=$(echo "$RELEASES" | python3 -c "
          import sys, json
          releases = json.load(sys.stdin)
          for r in releases:
            if not r.get('draft') and not r.get('prerelease'):
              for a in r.get('assets', []):
                n = a['name'].lower()
                if 'linux' in n and ('amd64' in n or 'x86_64' in n):
                  print(a['browser_download_url'])
                  exit()
          " 2>/dev/null || echo "")

          if [ -z "$ASSET_URL" ]; then
            # Fallback: download from main branch
            curl -sL "https://github.com/joss-language/Joss-Programming-Language/archive/refs/heads/main.zip" -o joss_src.zip
            unzip -q joss_src.zip
            cd Joss-Programming-Language-main
            go build -o ../joss ./cmd/joss
            cd ..
          else
            curl -sL "$ASSET_URL" -o joss
            chmod +x joss
            mv joss /usr/local/bin/joss || mv joss ./joss
          fi

          # Make sure joss is in PATH
          if ! command -v joss &>/dev/null; then
            chmod +x ./joss
            export PATH="$PWD:$PATH"
            echo "$PWD" >> $GITHUB_PATH
          fi
          joss version || ./joss version

      - name: Parse plugin name from joss.yaml
        id: meta
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import os, sys
          with open('joss.yaml', encoding='utf-8-sig') as f:
              lines = f.read().splitlines()
          vals = {}
          for l in lines:
              if ':' in l and not l.startswith(' '):
                  k, _, v = l.partition(':')
                  vals[k.strip()] = v.strip().strip('"').strip("'")
          name = vals.get('name', '')
          ver  = vals.get('version', '')
          if not name or not ver:
              print(f'ERROR: name={name!r} version={ver!r}', file=sys.stderr)
              sys.exit(1)
          ref_type = os.environ.get('GITHUB_REF_TYPE', '')
          ref_name = os.environ.get('GITHUB_REF_NAME', '')
          tag = ref_name if ref_type == 'tag' else f'v{ver}'
          repo_url = vals.get('repository', '')
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as f:
              f.write(f'name={name}\n')
              f.write(f'version={ver}\n')
              f.write(f'tag={tag}\n')
              f.write(f'repo={repo_url}\n')
          print(f'Plugin: {name} v{ver} tag={tag}')
          PYEOF

      - name: Download all sidecar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sidecar-*
          merge-multiple: true
          path: all-sidecars/

      - name: Update joss.yaml native URLs to point to this release
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          # Rewrite native section with release download URLs
          python3 - <<'PYEOF'
          import os, re

          name = os.environ['NAME']
          base = os.environ['BASE']

          with open('joss.yaml', 'r') as f:
              content = f.read()

          platforms = {
              'windows-amd64': f'{base}/{name}-windows-amd64.exe',
              'windows-arm64': f'{base}/{name}-windows-arm64.exe',
              'linux-amd64':   f'{base}/{name}-linux-amd64',
              'linux-arm64':   f'{base}/{name}-linux-arm64',
              'darwin-amd64':  f'{base}/{name}-darwin-amd64',
              'darwin-arm64':  f'{base}/{name}-darwin-arm64',
          }

          # Replace each native path line
          for plat, url in platforms.items():
              # Match local path or existing URL
              content = re.sub(
                  rf'(\s+{plat}:\s*).*',
                  rf'\g<1>{url}',
                  content
              )

          with open('joss.yaml', 'w') as f:
              f.write(content)

          print("Updated joss.yaml native URLs:")
          for plat, url in platforms.items():
              print(f"  {plat}: {url}")
          PYEOF

      - name: Build .jp package
        shell: bash
        run: |
          NAME="${{ steps.meta.outputs.name }}"
          joss build package . || ./joss build package .
          JP="${NAME}.jp"
          if [ ! -f "$JP" ]; then
            echo "ERROR: $JP no se generó"
            exit 1
          fi
          SIZE=$(du -sh "$JP" | cut -f1)
          echo "✓ ${JP} generado (${SIZE})"

      - name: Generate checksums
        shell: bash
        run: |
          NAME="${{ steps.meta.outputs.name }}"
          JP="${NAME}.jp"
          sha256sum "$JP" > SHA256SUMS.txt
          for f in all-sidecars/*; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
          VER: ${{ steps.meta.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type || 'published' }}
        run: |
          JP="${NAME}.jp"
          ASSETS=("$JP" "SHA256SUMS.txt")
          for f in all-sidecars/*; do
            ASSETS+=("$f")
          done

          if gh release view "$TAG" &>/dev/null; then
            echo "Actualizando release existente $TAG..."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creando release $TAG ($RELEASE_TYPE)..."
            FLAGS=("$TAG" --title "$NAME v$VER" --generate-notes)
            [ "$RELEASE_TYPE" = "draft" ]      && FLAGS+=(--draft)
            [ "$RELEASE_TYPE" = "prerelease" ] && FLAGS+=(--prerelease)
            gh release create "${FLAGS[@]}" "${ASSETS[@]}"
          fi
          echo ""
          echo "✓ Release $TAG publicado con:"
          echo "  - $JP (solo bytecode, KBs)"
          for f in all-sidecars/*; do
            echo "  - $(basename $f)"
          done
